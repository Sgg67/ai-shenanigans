name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        # test_greet_refuse_nodes.py imports graph.nodes.greet/refuse, but importing
        # any submodule of graph.nodes runs graph/nodes/__init__.py, which eagerly
        # imports every node -- including retrieve, which imports ingestion.py.
        # ingestion.py builds its Gemini/Pinecone clients at import time with real
        # network calls, so this file can't be collected without live credentials.
        run: pytest tests/ -v -m "not integration" --ignore=tests/test_greet_refuse_nodes.py

      - name: Byte-compile the app to catch syntax errors
        run: |
          python -m py_compile chainlit_app.py server.py main.py chatbot.py ingestion.py
